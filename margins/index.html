<script>
// Latest posts come from /api/substack (a Vercel function). If it fails,
// the "Read my Substack" card already in the grid stays as the fallback.
(async function () {
  const grid = document.getElementById('substack-posts');
  try {
    const res = await fetch('/api/substack');
    if (!res.ok) return;
    const { posts } = await res.json();
    if (!posts || !posts.length) return;
    grid.replaceChildren(...posts.map((post) => {
      const card = document.createElement('a');
      card.className = 'margin-card margin-card--note';
      card.href = post.link;
      card.target = '_blank';
      card.rel = 'noopener';
      const title = document.createElement('p');
      title.className = 'post-title';
      title.textContent = post.title;
      const date = document.createElement('p');
      date.className = 'post-date';
      date.textContent = new Date(post.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const excerpt = document.createElement('p');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      const more = document.createElement('p');
      more.className = 'post-more';
      more.textContent = 'Read →';
      card.append(title, date, excerpt, more);
      return card;
    }));
  } catch (err) {
    // keep the fallback card
  }
})();
</script>
